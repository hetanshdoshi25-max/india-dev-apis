# The source of truth. Edit this file; never edit README.md by hand —
# it is generated by scripts/build_readme.py and overwritten every day.
#
# Fields:
#   id       stable slug, used as the key in data/status.json
#   name     display name
#   category grouping in the README
#   what     one line, plain language, what you actually get back
#   docs     link to real documentation (not an aggregator page)
#   auth     none | key | oauth
#   free     what you get without paying — be specific, "free" alone is useless
#   probe    a real request the daily checker fires. Pick a stable, boring
#            example (Mumbai GPO, a large bank branch) so it never 404s.
#   example  a copy-pasteable curl. Must actually run.
#
# cors is NOT a field: the checker detects it from response headers, because
# published claims about CORS are wrong often enough to be worth measuring.

- id: postal-pincode
  name: Postal PIN Code
  category: Location & postal
  what: Post office name, district, state, delivery status for any 6-digit PIN.
  docs: http://www.postalpincode.in/Api-Details
  auth: none
  free: No published quota. Treat as best-effort, cache aggressively.
  probe:
    url: https://api.postalpincode.in/pincode/400001
    expect_contains: PostOffice
  example: |
    curl -s https://api.postalpincode.in/pincode/400001

- id: pincodeapi-in
  name: PincodeAPI.in
  category: Location & postal
  what: Same postal dataset, plus search-as-you-type and state/district listing.
  docs: https://api.pincodeapi.in/
  auth: none
  free: Unmetered at time of writing. Paginated for large states.
  probe:
    url: https://api.pincodeapi.in/api/v1/pincode/110001
    # The requested PIN is echoed in the response. Normally prefer a field name
    # over a value, but a request parameter coming back is about as stable as
    # it gets, and this API's key casing was not what the docs implied.
    expect_contains: "110001"
  example: |
    curl -s "https://api.pincodeapi.in/api/v1/search?q=Connaught%20Place"

- id: india-pincode-static
  name: India Pincode API (static)
  category: Location & postal
  what: Every PIN as a flat JSON file on GitHub Pages. No server, so nothing to rate-limit.
  docs: https://aniket-thapa.github.io/india-pincode-api/
  auth: none
  free: Unlimited — it is static hosting, not an API server.
  notes: >
    Best choice when you need bulk lookups or offline data. Worst choice when
    you need freshness: it updates only when the maintainer regenerates it.
  probe:
    url: https://aniket-thapa.github.io/india-pincode-api/states.json
    expect_contains: "["
  example: |
    curl -s https://aniket-thapa.github.io/india-pincode-api/pincodes/400001.json

- id: razorpay-ifsc
  name: Razorpay IFSC
  category: Banking & finance
  what: Bank, branch, address, MICR/SWIFT, and NEFT/RTGS/IMPS/UPI flags for an IFSC code.
  docs: https://github.com/razorpay/ifsc/wiki/API
  auth: none
  free: Public and unmetered. Razorpay runs it for the community.
  notes: >
    Built from RBI's own datasets, MIT licensed, and downloadable in bulk if you
    would rather not hit the network at all. BANK/BANKCODE reflect the sublet
    branch, so they may not match the bank name you expect.
  probe:
    url: https://ifsc.razorpay.com/HDFC0000001
    expect_contains: BANK
  example: |
    curl -s https://ifsc.razorpay.com/HDFC0000001

- id: data-gov-in
  name: data.gov.in OGD Platform
  category: Government & open data
  what: Thousands of government datasets as REST resources — crops, fuel prices, census, more.
  docs: https://data.gov.in/help/how-use-datasets-apis
  auth: key
  free: Free key after signup. Per-key rate limits apply.
  notes: >
    Dataset quality is uneven and resource IDs change without warning. Pin the
    resource ID you use and check it on every deploy.
  probe:
    url: https://www.data.gov.in/
    expect_status: [200, 301, 302]
    note: >
      Liveness only. The API itself needs a key, which this public repo has no
      business holding, so we check the platform is reachable and no more.
  example: |
    # Sign up at data.gov.in, then:
    curl -s "https://api.data.gov.in/resource/RESOURCE_ID?api-key=YOUR_KEY&format=json&limit=5"
