name: Check APIs

"on":
  schedule:
    - cron: "23 4 * * *"        # ~09:53 IST daily; odd minute to dodge the busy hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apis.yaml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: api-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/check.py
      - run: python scripts/build_readme.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily API status [skip ci]"
          file_pattern: "data/status.json README.md"
          commit_user_name: api-checker-bot
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
